<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Histórico & Análise - SCAAR</title>

    <link rel="stylesheet" href="style.css">
    
    <!-- Importando a biblioteca Chart.js para os gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <header class="main-header">

        <div class="brand">
            <div class="brand-icon">S</div>
            <h1>SCAAR</h1>
        </div>

        <nav class="main-navigation">
            <a href="index.html">Dashboard</a>
            <a href="historico.html" class="active">
                Histórico &amp; Análise
            </a>
        </nav>

        <div class="computer-information">
            <strong id="host-name">Carregando host...</strong>
            <span id="host-os">Aguardando dados...</span>
        </div>

    </header>

    <main class="dashboard-container">

        <h2 class="section-title">
            Histórico &amp; Análise
        </h2>

        <p style="margin-bottom: 20px;">
            Acompanhamento temporal e histórico dos testes de monitoramento de rede.
        </p>

        <!-- Container do Gráfico -->
        <article class="monitor-card" style="margin-bottom: 30px;">
            <div style="position: relative; height: 40vh; width: 100%;">
                <canvas id="historyChart"></canvas>
            </div>
        </article>

        <table class="network-table">

            <thead>
                <tr>
                    <th>DATA / HORA</th>
                    <th>DOWNLOAD</th>
                    <th>UPLOAD</th>
                    <th>PING</th>
                    <th>JITTER</th>
                    <th>PACOTES DESCARTADOS</th>
                    <th>HOST</th>
                </tr>
            </thead>
        
            <tbody id="history-table-body">
        
            </tbody>
        
        </table>

    </main>

    <script src="config.js"></script>
    <script>
        const API_BASE_URL = (window.SCAAR_API_BASE_URL || "http://127.0.0.1:5000").replace(/\/$/, "");
        const historyTableBody = document.getElementById("history-table-body");
        let chartInstance = null; // Variável para guardar o gráfico

        function formatNumber(value, suffix = "", digits = 1) {
            if (value === null || value === undefined || value === "") return "N/D";
            const n = Number(value);
            return Number.isFinite(n)
                ? `${n.toLocaleString("pt-BR", { maximumFractionDigits: digits })}${suffix}`
                : "N/D";
        }

        function formatDate(value) {
            if (!value) return "N/D";
            const date = new Date(String(value).replace(" ", "T"));
            return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString("pt-BR");
        }

        function addCell(row, value) {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
        }

        async function carregarHost() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/estado`, { cache: "no-store" });
                const dados = await response.json();
                if (dados.host && dados.host.nome_maquina) {
                    document.getElementById("host-name").textContent = dados.host.nome_maquina;
                    document.getElementById("host-os").textContent = dados.host.sistema_operacional || "SO não informado";
                }
            } catch (error) {
                console.error("Erro ao carregar host:", error);
                document.getElementById("host-name").textContent = "Erro de conexão";
                document.getElementById("host-os").textContent = "Sem dados da API";
            }
        }

        async function carregarHistorico() {
            historyTableBody.innerHTML = "";
            const loading = document.createElement("tr");
            addCell(loading, "Carregando histórico...");
            loading.firstChild.colSpan = 7;
            historyTableBody.appendChild(loading);

            try {
                const response = await fetch(`${API_BASE_URL}/api/testes-rede?limite=50`, { cache: "no-store" });
                const dados = await response.json().catch(() => []);
                if (!response.ok) throw new Error(dados.detalhe || dados.erro || `Erro HTTP ${response.status}`);

                historyTableBody.innerHTML = "";
                if (!Array.isArray(dados) || dados.length === 0) {
                    const row = document.createElement("tr");
                    addCell(row, "Nenhum teste de rede registrado ainda.");
                    row.firstChild.colSpan = 7;
                    historyTableBody.appendChild(row);
                    return;
                }

                // Preenche a tabela (do mais novo pro mais velho)
                dados.forEach((item) => {
                    const row = document.createElement("tr");
                    addCell(row, formatDate(item.data_hora_teste));
                    addCell(row, formatNumber(item.download_mbps, " Mbps"));
                    addCell(row, formatNumber(item.upload_mbps, " Mbps"));
                    addCell(row, formatNumber(item.ping_ms, " ms"));
                    addCell(row, item.jitter_ms == null ? "N/D" : formatNumber(item.jitter_ms, " ms"));
                    addCell(row, item.pacotes_descartados == null ? "N/D" : String(item.pacotes_descartados));
                    addCell(row, item.nome_maquina || `Host ${item.id_host}`);
                    historyTableBody.appendChild(row);
                });

                // Desenha o gráfico
                renderizarGrafico(dados);

            } catch (error) {
                console.error("Erro ao carregar histórico:", error);
                historyTableBody.innerHTML = "";
                const row = document.createElement("tr");
                addCell(row, `Não foi possível carregar o histórico: ${error.message}`);
                row.firstChild.colSpan = 7;
                historyTableBody.appendChild(row);
            }
        }

        function renderizarGrafico(dados) {
            // Inverte o array para o gráfico ir do mais antigo (esquerda) para o mais novo (direita)
            const dadosCronologicos = [...dados].reverse();

            const labelsX = dadosCronologicos.map(item => {
                const d = new Date(String(item.data_hora_teste).replace(" ", "T"));
                return `${d.toLocaleDateString("pt-BR").substring(0, 5)} ${d.toLocaleTimeString("pt-BR", {hour: '2-digit', minute:'2-digit'})}`;
            });

            const dadosDownload = dadosCronologicos.map(item => item.download_mbps);
            const dadosUpload = dadosCronologicos.map(item => item.upload_mbps);
            const dadosPing = dadosCronologicos.map(item => item.ping_ms);

            const ctx = document.getElementById('historyChart').getContext('2d');

            // Destrói o gráfico anterior caso a função seja chamada novamente (ex: refresh)
            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labelsX,
                    datasets: [
                        {
                            label: 'Download (Mbps)',
                            data: dadosDownload,
                            borderColor: '#22c55e', // Verde
                            backgroundColor: 'rgba(34, 197, 94, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true
                        },
                        {
                            label: 'Upload (Mbps)',
                            data: dadosUpload,
                            borderColor: '#3b82f6', // Azul
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true
                        },
                        {
                            label: 'Ping (ms)',
                            data: dadosPing,
                            borderColor: '#f59e0b', // Laranja
                            backgroundColor: 'rgba(245, 158, 11, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true,
                            hidden: true // Começa oculto para não achatar as velocidades se for muito alto
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                font: { family: 'Arial, Helvetica, sans-serif' },
                                usePointStyle: true
                            }
                        },
                        tooltip: {
                            backgroundColor: '#111111',
                            titleFont: { size: 13 },
                            bodyFont: { size: 13 },
                            padding: 10,
                            cornerRadius: 6
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { maxTicksLimit: 10 } // Evita amontoar datas se houver muitos testes
                        },
                        y: {
                            beginAtZero: true,
                            grid: { color: '#e3e3e6' }
                        }
                    }
                }
            });
        }

        carregarHost();
        carregarHistorico();
    </script>
</body>

</html>
